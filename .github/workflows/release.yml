name: Build and Release

on:
  push:
    branches:
      - '*'
    tags:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            os_name: linux
            arch: x64
            libc: gnu
            asset: guard-checker-linux-x64-gnu
            name: linux-x64-gnu
          - os: ubuntu-24.04-arm
            os_name: linux
            arch: arm64
            libc: gnu
            asset: guard-checker-linux-arm64-gnu
            name: linux-arm64-gnu
          - os: macos-15-intel
            os_name: macos
            arch: x64
            libc: ""
            asset: guard-checker-macos-x64
            name: macos-x64
          - os: macos-15
            os_name: macos
            arch: arm64
            libc: ""
            asset: guard-checker-macos-arm64
            name: macos-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup build environment (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential binutils file

      - name: Build binary
        working-directory: xahaud/include/xrpl/hook
        run: make

      - name: Rename binary
        working-directory: xahaud/include/xrpl/hook
        run: mv guard_checker "${{ matrix.asset }}"

      - name: Verify binary architecture
        run: |
          sh scripts/check-binary-arch.sh \
            "xahaud/include/xrpl/hook/${{ matrix.asset }}" \
            "${{ matrix.os_name }}" \
            "${{ matrix.arch }}" \
            "${{ matrix.libc }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          path: xahaud/include/xrpl/hook/${{ matrix.asset }}
          retention-days: 1

  build-musl:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    container: alpine:3.21
    defaults:
      run:
        shell: sh
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            os_name: linux
            arch: x64
            libc: musl
            asset: guard-checker-linux-x64-musl
            name: linux-x64-musl
          - os: ubuntu-24.04-arm
            os_name: linux
            arch: arm64
            libc: musl
            asset: guard-checker-linux-arm64-musl
            name: linux-arm64-musl

    steps:
      - name: Install Alpine packages
        run: |
          apk add --no-cache build-base file binutils g++ git ca-certificates libstdc++ gcompat tar
          # JS actions refuse Alpine on arm64 when ID=alpine (actions/runner#1637).
          sed -i 's/^ID=alpine/ID=linux/' /etc/os-release
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build binary
        working-directory: xahaud/include/xrpl/hook
        run: make

      - name: Rename binary
        working-directory: xahaud/include/xrpl/hook
        run: mv guard_checker "${{ matrix.asset }}"

      - name: Verify binary architecture
        run: |
          sh scripts/check-binary-arch.sh \
            "xahaud/include/xrpl/hook/${{ matrix.asset }}" \
            "${{ matrix.os_name }}" \
            "${{ matrix.arch }}" \
            "${{ matrix.libc }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          path: xahaud/include/xrpl/hook/${{ matrix.asset }}
          retention-days: 1

  create-release:
    needs: [build, build-musl]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: artifacts/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
