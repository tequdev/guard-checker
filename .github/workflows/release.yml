name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (vX.Y.Z for stable, vX.Y.Z-<suffix> for prerelease)'
        required: true
        type: string
      prerelease:
        description: 'Mark the release as a prerelease'
        required: true
        type: boolean
        default: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate tag and prerelease flag
        env:
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -eu
          if printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            if [ "$PRERELEASE" != "false" ]; then
              echo "::error::Stable tag '$TAG' requires prerelease=false"
              exit 1
            fi
          elif printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$'; then
            if [ "$PRERELEASE" != "true" ]; then
              echo "::error::Prerelease tag '$TAG' requires prerelease=true"
              exit 1
            fi
          else
            echo "::error::Invalid tag '$TAG' (expected vX.Y.Z or vX.Y.Z-<suffix>)"
            exit 1
          fi
          rc=0
          git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null || rc=$?
          case $rc in
            0) echo "::error::Tag '$TAG' already exists"; exit 1 ;;
            2) ;;
            *) echo "::error::Failed to query remote tags (exit $rc)"; exit 1 ;;
          esac

  build:
    needs: [validate]
    uses: ./.github/workflows/ci.yml

  create-release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ inputs.tag }}
          files: artifacts/**/*
          draft: false
          prerelease: ${{ inputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
